# Render blueprint for the Rincón Riichi API.
# Deploy with one click: https://render.com/deploy?repo=<this-repo>
services:
  - type: web
    name: rincon-riichi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn rincon_riichi_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /
    autoDeploy: true
