[project]
name = "rincon-riichi-api"
version = "0.1.0"
description = "Riichi mahjong hand engine and table simulation API for Rincón Riichi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "monicavieres" }]
keywords = ["riichi", "mahjong", "api", "fastapi", "hand-generator"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rincon_riichi_api*"]
